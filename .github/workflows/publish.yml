name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: npm publish (GitHub Packages)
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: bun publish
        run: bun publish
        env:
          BUN_TOKEN: ${{ secrets.BUN_TOKEN }}

      - name: jsr publish
        run: npx jsr publish
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}